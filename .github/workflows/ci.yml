name: CI

# brief §53/§91: her modülden sonra test çalıştırılır, build kırılırsa yeni
# özellik eklenmez. Bu pipeline, o kuralın CI karşılığıdır.
#
# NOT (düzeltme geçmişi): İlk sürüm `npm ci` + `actions/setup-node`'un
# `cache: 'npm'` seçeneğini kullanıyordu — ikisi de bir `package-lock.json`
# gerektirir. Bu geliştirme ortamının npm registry erişimi kısıtlı olduğu
# için (bkz. docs/ARCHITECTURE.md §9) hiçbir zaman `npm install`
# çalıştırılamadı ve lock dosyası hiç üretilmedi; bu yüzden ilk 4 CI
# çalıştırması "Dependencies lock file is not found" hatasıyla saniyeler
# içinde başarısız oldu (GitHub Actions'ın kendi runner'ının internet
# erişimi bu ortamdan bağımsızdır — asıl engel yalnızca lock dosyasının
# eksikliğiydi). Düzeltme: `npm install` kullan (lock dosyası gerektirmez,
# eksikse üretir) ve `cache: 'npm'`'i kaldır. Lock dosyası bir kez CI'da
# üretilip commit edildiğinde `npm ci` + cache'e geri dönülebilir.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # FAZ 1 wiring (bu oturum): apps/api/test/api/player.e2e-spec.ts artık
    # GERÇEK bir PostgreSQL'e karşı çalışıyor (domain/API/infra katmanlarının
    # doğru bağlandığının kanıtı — sadece typecheck/build değil). GitHub
    # Actions'ın "service container" özelliği, job boyunca ayakta duran
    # geçici bir Postgres örneği sağlar; job bitince otomatik silinir,
    # kalıcı bir veri/maliyet oluşturmaz.
    # FAZ 1 wiring, dokuzuncu dilim: `RedisModule` `app.module.ts`'e
    # bağlandı (brief §54 Idempotency-Key) — `AppModule`'ü bootstrap eden
    # HER e2e testi (sadece Race/Idempotency ile ilgili olanlar DEĞİL,
    # çünkü `RedisModule` `@Global()`) artık GERÇEK bir Redis bağlantısı
    # gerektiriyor. `postgres` servisiyle AYNI desen: geçici, job bitince
    # silinir.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: at_sevdalisi
          POSTGRES_PASSWORD: at_sevdalisi
          POSTGRES_DB: at_sevdalisi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U at_sevdalisi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://at_sevdalisi:at_sevdalisi@localhost:5432/at_sevdalisi
      REDIS_URL: redis://localhost:6379
      # AUDIT_REPORT.md Bulgu S1 hardening (bu oturum) — `AuthGuard`/
      # `TokenService` artık `AppConfigService.env.jwtSecret`'ı gerektirir
      # (bkz. `infrastructure/config/config.service.ts`). Yalnızca CI'a
      # özgü bir test sırrıdır, gerçek üretim değeri repo dışında (hosting
      # ortam değişkeni olarak) ayrıca tanımlanmalıdır.
      JWT_SECRET: ci-test-only-jwt-secret-never-use-in-production
      # AUDIT_REPORT.md Bulgu S5 (High) hardening (bu oturum) — yeni
      # `RateLimitGuard` (bkz. apps/api/src/api/rate-limit/rate-limit.guard.ts)
      # `POST /players` (kayıt) ve `POST /auth/login`'i sınırlar. Her
      # e2e test dosyası `registerTestPlayer`'ı (bkz. test-helpers.ts)
      # tekrar tekrar, AYNI runner IP'sinden çağırdığından, gerçek limit
      # AÇIK bırakılırsa test paketinin kendisi 429'a TAKILIR — T1
      # eşzamanlılık testlerinin (CI #100-109) aynı sınıftaki yanlış
      # pozitif riskiyle AYNI ders. Rate limiting'in KENDİSİ, izole
      # `rate-limit.e2e-spec.ts` içinde bu bayrağı GEÇİCİ olarak
      # `'false'`'e çevirerek ayrıca test edilir (bkz. o dosyanın doc
      # yorumu) — bu yüzden burada devre dışı bırakılması davranışı
      # DOĞRULANMADAN kapatmak DEĞİLDİR.
      DISABLE_RATE_LIMIT: 'true'

    steps:
      - uses: actions/checkout@v4

      # 30.09.2026: Node 20'nin desteği 30.04.2026'da bitti ve GitHub Actions
      # loglarında uyarı veriyordu → 22 (LTS). `package-lock.json` artık
      # commit'li ve `npm ci` ile uyumlu (yerelde doğrulandı), bu yüzden
      # yukarıdaki notun öngördüğü geri dönüş yapıldı: `npm ci` + önbellek.
      # `npm ci` kilit dosyasıyla çelişen bir `package.json`da DÜŞER — bu
      # istenen davranıştır (kurulum artık tekrarlanabilir).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run database migrations
        run: npm run migrate

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # 02.10.2026 (Faz 13-A) — GÜVENLİK TARAMASI.
  # (1) Bağımlılık kapısı: YÜKSEK/KRİTİK her danışman
  #     `security/audit-allowlist.json`da gerekçeli + süresi dolmamış bir
  #     kayıt ister; yeni açık ya da süresi dolan izin CI'ı kırar.
  # (2) Gizli anahtar taraması: tüm git geçmişi gitleaks ile taranır;
  #     incelenmiş yanlış pozitifler `.gitleaksignore`da. İkili sürüm
  #     sabitlenir ve SHA-256 ile doğrulanır.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Dependency audit gate
        run: node tools/security/audit-gate.mjs
      - name: Install gitleaks (pinned + SHA-256)
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      # Bulgular (değerler REDAKTE) annotation olarak da yazılır — log'a
      # erişemeyen biri de neyin, nerede bulunduğunu görebilsin.
      - name: Secret scan (gitleaks)
        run: |
          set +e
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" .
          code=$?
          set -e
          if [ -s "$RUNNER_TEMP/gitleaks.json" ]; then
            node -e '
              const findings = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              for (const f of findings) {
                console.log(`::error file=${f.File},line=${f.StartLine}::gitleaks ${f.RuleID} (commit ${f.Commit.slice(0, 8)}, fingerprint ${f.Fingerprint})`);
              }
              console.log(`::notice::gitleaks bulgu sayısı: ${findings.length}`);
            ' "$RUNNER_TEMP/gitleaks.json"
          fi
          echo "::notice::gitleaks çıkış kodu: $code"
          exit $code

  # 02.10.2026 (Faz 13-A) — imajlar her değişiklikte DERLENİR (gönderilmez).
  # Duman testi: API imajı üretim modunda ortam değişkenleri olmadan
  # AÇILMAYI REDDETMELİDİR (production-env.ts) — imaj hem çalışır hem de
  # güvensiz yapılandırmayla canlıya çıkamaz.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t at-sevdalisi-api .
      - name: Build migrate image
        run: docker build -f apps/api/Dockerfile --target migrate -t at-sevdalisi-migrate .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://api.example.invalid/api/v1 -t at-sevdalisi-web .
      - name: API image refuses to start without production env
        run: |
          set +e
          output=$(docker run --rm at-sevdalisi-api 2>&1)
          code=$?
          set -e
          echo "$output"
          test "$code" -ne 0
          echo "$output" | grep -q "\[ortam\] HATA: JWT_SECRET"
