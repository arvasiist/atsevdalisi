name: CI

# brief §53/§91: her modülden sonra test çalıştırılır, build kırılırsa yeni
# özellik eklenmez. Bu pipeline, o kuralın CI karşılığıdır.
#
# NOT (düzeltme geçmişi): İlk sürüm `npm ci` + `actions/setup-node`'un
# `cache: 'npm'` seçeneğini kullanıyordu — ikisi de bir `package-lock.json`
# gerektirir. Bu geliştirme ortamının npm registry erişimi kısıtlı olduğu
# için (bkz. docs/ARCHITECTURE.md §9) hiçbir zaman `npm install`
# çalıştırılamadı ve lock dosyası hiç üretilmedi; bu yüzden ilk 4 CI
# çalıştırması "Dependencies lock file is not found" hatasıyla saniyeler
# içinde başarısız oldu (GitHub Actions'ın kendi runner'ının internet
# erişimi bu ortamdan bağımsızdır — asıl engel yalnızca lock dosyasının
# eksikliğiydi). Düzeltme: `npm install` kullan (lock dosyası gerektirmez,
# eksikse üretir) ve `cache: 'npm'`'i kaldır. Lock dosyası bir kez CI'da
# üretilip commit edildiğinde `npm ci` + cache'e geri dönülebilir.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # FAZ 1 wiring (bu oturum): apps/api/test/api/player.e2e-spec.ts artık
    # GERÇEK bir PostgreSQL'e karşı çalışıyor (domain/API/infra katmanlarının
    # doğru bağlandığının kanıtı — sadece typecheck/build değil). GitHub
    # Actions'ın "service container" özelliği, job boyunca ayakta duran
    # geçici bir Postgres örneği sağlar; job bitince otomatik silinir,
    # kalıcı bir veri/maliyet oluşturmaz.
    # FAZ 1 wiring, dokuzuncu dilim: `RedisModule` `app.module.ts`'e
    # bağlandı (brief §54 Idempotency-Key) — `AppModule`'ü bootstrap eden
    # HER e2e testi (sadece Race/Idempotency ile ilgili olanlar DEĞİL,
    # çünkü `RedisModule` `@Global()`) artık GERÇEK bir Redis bağlantısı
    # gerektiriyor. `postgres` servisiyle AYNI desen: geçici, job bitince
    # silinir.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: at_sevdalisi
          POSTGRES_PASSWORD: at_sevdalisi
          POSTGRES_DB: at_sevdalisi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U at_sevdalisi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://at_sevdalisi:at_sevdalisi@localhost:5432/at_sevdalisi
      REDIS_URL: redis://localhost:6379
      # AUDIT_REPORT.md Bulgu S1 hardening (bu oturum) — `AuthGuard`/
      # `TokenService` artık `AppConfigService.env.jwtSecret`'ı gerektirir
      # (bkz. `infrastructure/config/config.service.ts`). Yalnızca CI'a
      # özgü bir test sırrıdır, gerçek üretim değeri repo dışında (hosting
      # ortam değişkeni olarak) ayrıca tanımlanmalıdır.
      JWT_SECRET: ci-test-only-jwt-secret-never-use-in-production
      # AUDIT_REPORT.md Bulgu S5 (High) hardening (bu oturum) — yeni
      # `RateLimitGuard` (bkz. apps/api/src/api/rate-limit/rate-limit.guard.ts)
      # `POST /players` (kayıt) ve `POST /auth/login`'i sınırlar. Her
      # e2e test dosyası `registerTestPlayer`'ı (bkz. test-helpers.ts)
      # tekrar tekrar, AYNI runner IP'sinden çağırdığından, gerçek limit
      # AÇIK bırakılırsa test paketinin kendisi 429'a TAKILIR — T1
      # eşzamanlılık testlerinin (CI #100-109) aynı sınıftaki yanlış
      # pozitif riskiyle AYNI ders. Rate limiting'in KENDİSİ, izole
      # `rate-limit.e2e-spec.ts` içinde bu bayrağı GEÇİCİ olarak
      # `'false'`'e çevirerek ayrıca test edilir (bkz. o dosyanın doc
      # yorumu) — bu yüzden burada devre dışı bırakılması davranışı
      # DOĞRULANMADAN kapatmak DEĞİLDİR.
      DISABLE_RATE_LIMIT: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run database migrations
        run: npm run migrate

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
