name: CI

# brief §53/§91: her modülden sonra test çalıştırılır, build kırılırsa yeni
# özellik eklenmez. Bu pipeline, o kuralın CI karşılığıdır.
#
# NOT: Bu iskelet bu depoda çalıştırılıp doğrulanmamıştır çünkü bu
# geliştirme ortamının npm registry erişimi kısıtlıdır (bkz.
# docs/ARCHITECTURE.md §9). Gerçek bir GitHub Actions runner'ında (npm
# registry erişimi açık) ilk push sonrası otomatik çalışacaktır.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
