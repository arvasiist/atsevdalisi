name: CI

# brief §53/§91: her modülden sonra test çalıştırılır, build kırılırsa yeni
# özellik eklenmez. Bu pipeline, o kuralın CI karşılığıdır.
#
# NOT (düzeltme geçmişi): İlk sürüm `npm ci` + `actions/setup-node`'un
# `cache: 'npm'` seçeneğini kullanıyordu — ikisi de bir `package-lock.json`
# gerektirir. Bu geliştirme ortamının npm registry erişimi kısıtlı olduğu
# için (bkz. docs/ARCHITECTURE.md §9) hiçbir zaman `npm install`
# çalıştırılamadı ve lock dosyası hiç üretilmedi; bu yüzden ilk 4 CI
# çalıştırması "Dependencies lock file is not found" hatasıyla saniyeler
# içinde başarısız oldu (GitHub Actions'ın kendi runner'ının internet
# erişimi bu ortamdan bağımsızdır — asıl engel yalnızca lock dosyasının
# eksikliğiydi). Düzeltme: `npm install` kullan (lock dosyası gerektirmez,
# eksikse üretir) ve `cache: 'npm'`'i kaldır. Lock dosyası bir kez CI'da
# üretilip commit edildiğinde `npm ci` + cache'e geri dönülebilir.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # FAZ 1 wiring (bu oturum): apps/api/test/api/player.e2e-spec.ts artık
    # GERÇEK bir PostgreSQL'e karşı çalışıyor (domain/API/infra katmanlarının
    # doğru bağlandığının kanıtı — sadece typecheck/build değil). GitHub
    # Actions'ın "service container" özelliği, job boyunca ayakta duran
    # geçici bir Postgres örneği sağlar; job bitince otomatik silinir,
    # kalıcı bir veri/maliyet oluşturmaz.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: at_sevdalisi
          POSTGRES_PASSWORD: at_sevdalisi
          POSTGRES_DB: at_sevdalisi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U at_sevdalisi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://at_sevdalisi:at_sevdalisi@localhost:5432/at_sevdalisi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # GEÇİCİ TEŞHİS ADIMI (bu oturum): "Lint" adımı üç kez üst üste,
      # farklı kod değişiklikleriyle (hatta değişiklik OLMADAN, sadece
      # sürüm sabitlemesiyle) AYNI şekilde exit code 1 verdi, ama
      # annotation panelinde hiçbir gerçek hata görünmüyor — sadece bilinen
      # ve zararsız "no magic number" uyarıları. Ham iş günlüğü bu ortamdan
      # (kimlik doğrulama gerektirdiği için) okunamadı. Bu adım, eslint'in
      # TAM çıktısını (varsa gizli bir çökme/hata mesajını) doğrudan
      # çalıştırma özetine (Summary sekmesi) yazdırır — hem annotation
      # panelinden hem ham günlükten daha erişilebilir bir kanal. Kök neden
      # bulunduktan sonra bu adım normal `npm run lint` çağrısına geri
      # döndürülecektir.
      - name: Lint
        run: |
          set +e
          npm run lint > /tmp/lint-output.txt 2>&1
          code=$?
          echo "eslint exit code: $code"
          cat /tmp/lint-output.txt
          {
            echo "## Lint çıktısı (exit code: $code)"
            echo '```'
            cat /tmp/lint-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Typecheck
        run: npm run typecheck

      - name: Run database migrations
        run: npm run migrate

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
