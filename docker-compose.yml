version: '3.9'

# Yerel geliştirme ortamı için PostgreSQL + Redis.
# Kullanım: docker compose up -d postgres redis
# Bağlantı bilgileri apps/api/.env.example ile eşleşir.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: at_sevdalisi
      POSTGRES_PASSWORD: at_sevdalisi
      POSTGRES_DB: at_sevdalisi
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U at_sevdalisi']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
